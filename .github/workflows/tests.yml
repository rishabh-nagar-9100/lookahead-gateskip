name: tests

on:
  push:
  pull_request:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CI needs only what the CPU tests import (DECISIONS D-10): CPU-only torch wheel,
      # transformers, peft (LoRA training test), numpy, pyyaml, python-dotenv, pytest.
      # Versions pinned to requirements.lock.txt so CI tests the locked environment.
      # lm-eval / datasets are not installed here.
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.22.1 peft==0.21.2 numpy==2.4.6 pyyaml==6.0.3 python-dotenv==1.2.4 pytest==9.2.0
          pip install -e . --no-deps

      - name: Run pytest
        run: pytest -q
