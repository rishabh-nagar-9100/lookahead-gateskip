# P3-07 Dense-FT reference (D-15 item 4, E-DFT-Q): Qwen2.5-1.5B-Instruct (primary model, D-23) fine-tuned
# on the D-06 chat data with NO router or gates. Recipe = configs/train/recipes/qwen_lora16.yaml (D-13),
# identical to the GateSkip port and our method. Runs on a Colab L4 (bf16), never on a T4.
name: denseft_qwen
device: auto
model:
  pretrained: Qwen/Qwen2.5-1.5B-Instruct
  dtype: auto                     # frozen base weights: bf16 on L4/A100
  attn_implementation: sdpa       # eager overflows in fp16 on Qwen2.5 (P2-01)
recipe: configs/train/recipes/qwen_lora16.yaml
method:
  name: dense                     # LookaheadGatedModel with the router off (T-EQ: identical to HF)
  router_config: configs/router/lagate.yaml
  sparsity_weight: 0.0            # no gates, no sparsity loss
checkpoint:
  enabled: true
  every_minutes: 30               # Colab sessions end without warning; resume is automatic on restart
  root: null                      # $LAGATE_CHECKPOINT_ROOT, else checkpoints/ (symlinked to Drive in Colab)
export: hf                        # merged model -> <checkpoint dir>/hf for lm-eval (configs/eval/gsm8k_chat_denseft_qwen*.yaml)
save_checkpoint: false
