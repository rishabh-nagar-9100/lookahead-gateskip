# GPU-hour estimate for the whole project (scripts/gpu_budget.py, docs/GPU_BUDGET.md).
# Every number here is an assumption to replace with measurements from the first GPU session (P0-11 task).
name: gpu_budget

gpus:
  a100:    {label: "A100 80GB",          train_speed: 1.0, decode_ms_per_token: {llama: 20, qwen: 28}}
  rtx4090: {label: "RTX 4090 24GB",      train_speed: 0.55, decode_ms_per_token: {llama: 16, qwen: 22}}
  # train_speed: training throughput relative to A100 (bf16 dense ≈ 165 vs 312 TFLOPS, plus memory).
  # decode: bs=1 HF generate is launch/latency-bound for 1–1.5B models, so a 4090 decodes about as
  # fast as an A100. L4 24GB: ≈ 0.35 train_speed and ≈ 1.5× the 4090 decode time.

training:
  # One run = 1 epoch of the D-06 mix in chat format: GSM8K train 7,473 + CSQA-Nemotron ≈ 9,741 examples.
  # ≈ 0.1 s/step at bs=1 on an A100 for Llama-1B (fwd+bwd ≈ 2e12 FLOPs at ≈ 300 tokens, + launch
  # overhead of our Python layer loop, + AdamW step), × 17.2k steps ≈ 0.5 h.
  hours_a100: {llama: 0.5, qwen: 0.75}
  method_overhead: {dense: 1.0, lagate: 1.05, gateskip: 1.15, baseline: 1.1, lookahead: 1.05}  # gate/router cost (FLOP report) + EMA
  official_gateskip_hours_a100: 2.0   # their own recipe and 2 h cap (jobs/job_common.sh); A100 only
  calibration_hours_a100: 0.05        # soft-gate pass over the calibration split

eval:
  gsm8k:  {items: 1319, gen_tokens: 200}   # our runs: 128–219 avg output tokens
  mbpp:   {items: 500,  gen_tokens: 150}
  mc_hours_a100: 0.1                       # ARC-Challenge + PIQA, log-likelihood only
  dev_items: 300                           # λ sweep / ablation dev evals (calibration-side split, not test)
  routing_overhead: 1.6                    # gated bs=1 engine vs HF (MPS measurement; likely lower on CUDA)
  batched_speedup: 8                       # batched accuracy eval vs bs=1 (lm-eval batch 16)

latency_study_hours: {minimal: 6, full: 12}  # E11: bs=1 subsets, compile / CUDA-graph variants, both models

plans:
  # runs = trained models; seeds multiply runs. evals: gsm8k_budgets = GSM8K-only test evals per model,
  # (a suite eval already includes GSM8K, so "3 budgets, full suite at one" = gsm8k_budgets 2 + suite_budgets 1);
  # suite_budgets = full-suite (GSM8K+ARC+PIQA+MBPP) evals per model, dev = dev-set evals per model.
  minimal:
    E0 dense suite (untrained, both models):        {model: both,  method: none,      runs: 0, seeds: 1, suite_budgets: 1}
    E-DFT Dense-FT Llama (+ P3-08 check):           {model: llama, method: dense,     runs: 1, seeds: 1, suite_budgets: 1}
    E-DFT-Q Dense-FT Qwen:                          {model: qwen,  method: dense,     runs: 1, seeds: 1, gsm8k_budgets: 1}
    E1 GateSkip port Llama (3 budgets):             {model: llama, method: gateskip,  runs: 1, seeds: 1, gsm8k_budgets: 2, suite_budgets: 1}
    E1-official reproduction check (A100):          {model: llama, method: official,  runs: 1, seeds: 1}
    P3-03 λ sweep, 3 values:                        {model: llama, method: lagate,    runs: 3, seeds: 1, dev: 1}
    E4 ours Llama, 3 budgets:                       {model: llama, method: lagate,    runs: 1, seeds: 3, gsm8k_budgets: 2, suite_budgets: 1}
    E5 baselines FlexiDepth, D-LLM, FFN-skip:       {model: llama, method: baseline,  runs: 3, seeds: 1, gsm8k_budgets: 1}
    E5 random skip (no training):                   {model: llama, method: none,      runs: 0, seeds: 1, gsm8k_budgets: 1}
    E6–E9 ablations (6 variants):                   {model: llama, method: lagate,    runs: 6, seeds: 1, dev: 1}
    E10 Qwen ours + GateSkip:                       {model: qwen,  method: lagate,    runs: 2, seeds: 1, gsm8k_budgets: 3}
    E12 lookahead mode:                             {model: llama, method: lookahead, runs: 1, seeds: 1, gsm8k_budgets: 3}
  full:
    E0 dense suite (untrained, both models):        {model: both,  method: none,      runs: 0, seeds: 1, suite_budgets: 1}
    E-DFT Dense-FT Llama:                           {model: llama, method: dense,     runs: 1, seeds: 3, suite_budgets: 1}
    E-DFT-Q Dense-FT Qwen:                          {model: qwen,  method: dense,     runs: 1, seeds: 3, suite_budgets: 1}
    E1 GateSkip port Llama (3 budgets):             {model: llama, method: gateskip,  runs: 1, seeds: 3, suite_budgets: 3}
    E1-official reproduction check (A100):          {model: llama, method: official,  runs: 1, seeds: 3}
    P3-03 λ sweep, 4 values:                        {model: llama, method: lagate,    runs: 4, seeds: 1, dev: 3}
    E4 ours Llama, 3 budgets:                       {model: llama, method: lagate,    runs: 1, seeds: 3, suite_budgets: 3}
    E5 baselines FlexiDepth, D-LLM, FFN-skip:       {model: llama, method: baseline,  runs: 3, seeds: 3, suite_budgets: 3}
    E5 random skip (no training):                   {model: llama, method: none,      runs: 0, seeds: 3, suite_budgets: 3}
    E6–E9 ablations (6 variants):                   {model: llama, method: lagate,    runs: 6, seeds: 3, gsm8k_budgets: 3}
    E10 Qwen ours + GateSkip:                       {model: qwen,  method: lagate,    runs: 2, seeds: 3, suite_budgets: 3}
    E12 lookahead mode:                             {model: llama, method: lookahead, runs: 1, seeds: 3, gsm8k_budgets: 3}
