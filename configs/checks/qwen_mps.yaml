# Real-model checks on the cached Qwen2.5-1.5B-Instruct (no downloads): sizes vs config.json,
# full-scale T-EQ, dense engine = HF greedy generate, and a first bs=1 latency pass (P5-01).
name: realcheck_qwen_mps
model: Qwen/Qwen2.5-1.5B-Instruct
expected_dims_config: configs/flops/qwen.yaml   # dims we use for FLOP accounting
device: mps
teq_dtypes: [float32, float16]    # fp32 = tight check; fp16 = deployment dtype on MPS (D-08 configs)
gen_dtype: float16
prompts:
  dataset: openai/gsm8k
  subset: main
  split: test
  doc_ids: [0, 1, 2]
  chat_config: configs/eval/gsm8k_chat_dense_qwen.yaml   # D-15 system instruction + chat template
generate:
  max_new_tokens: 64              # fixed length (no early stop) so timings compare
  # Qwen's generation_config.json sets repetition_penalty 1.1, which HF applies even with
  # do_sample=False. Pure greedy (what our engine does) needs it overridden to 1.0.
  hf_overrides: {repetition_penalty: 1.0}
latency:
  warmup_runs: 1
  timed_runs: 5
  # dense: fast path. general_tier1: decision path, every token Tier 1 (2 host syncs per layer per token).
  # lagate_noskip: our untrained router + EMA computed, thresholds -inf (routing cost, no savings).
  # lagate_noskip_per_layer: same, sync_mode per_layer (1 host sync per layer instead of 2; P5-06).
  engine_variants: [dense, general_tier1, lagate_noskip, lagate_noskip_per_layer]
  hf_attn_implementations: [sdpa]   # HF default; HF eager gives NaN logits in fp16 on Qwen2.5 (q·kᵀ overflow), so it is not timed
