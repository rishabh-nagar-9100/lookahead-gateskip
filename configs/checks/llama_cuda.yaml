# Real-model checks on a CUDA GPU (docs/GPU_RUNBOOK.md, step 5): sizes vs config.json, full-scale
# T-EQ, dense engine = HF pure greedy, first bs=1 latency numbers (P5-01/P5-02).
# The model is downloaded on first use (≈ 3 GB); meta-llama/Llama-3.2-1B-Instruct needs gated access (P0-01)
name: realcheck_llama_cuda
model: meta-llama/Llama-3.2-1B-Instruct
expected_dims_config: configs/flops/llama.yaml
device: cuda
teq_dtypes: [float32, auto]       # fp32 = tight check; auto = bf16 on L4/A100, fp16 on T4 (deployment dtype)
gen_dtype: auto                   # bf16 on L4/A100, fp16 on T4 (meta.json records the resolved dtype)
prompts:
  dataset: openai/gsm8k
  subset: main
  split: test
  doc_ids: [0, 1, 2]
  chat_config: configs/eval/gsm8k_chat_dense_llama.yaml
generate:
  max_new_tokens: 64
  hf_overrides: {repetition_penalty: 1.0}   # pure greedy (D-21)
latency:
  warmup_runs: 1
  timed_runs: 5
  engine_variants: [dense, general_tier1, lagate_noskip, lagate_noskip_per_layer]
  hf_attn_implementations: [sdpa]
